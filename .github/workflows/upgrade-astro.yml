name: Upgrade Astro

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency: upgrade-astro

jobs:
  check:
    # This file ships with the template. Never run in scaffolded projects.
    if: github.repository == 'koval-dev/astro-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open the major-version issue
    outputs:
      latest: ${{ steps.decide.outputs.latest }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(npm view astro version)
          current=$(node -p "require('./package-lock.json').packages['node_modules/astro'].version")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if gh release view "v$latest" >/dev/null 2>&1; then
            echo "v$latest is already released"
            exit 0
          fi

          if [ "${latest%%.*}" -gt "${current%%.*}" ]; then
            title="Upgrade to Astro ${latest%%.*}"
            count=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq length)
            if [ "$count" -eq 0 ]; then
              gh issue create --title "$title" --body "Astro $latest is out. Majors are not auto-released: upgrade by hand using https://docs.astro.build/en/upgrade-astro/. Daily auto-release resumes once main is on this major."
            fi
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    # Runs third-party code, so it gets no write access. Only the lockfile leaves this job.
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Upgrade and build
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          npm install "astro@$LATEST"
          npm version "$LATEST" --no-git-tag-version --allow-same-version
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: lockfile
          path: package-lock.json
          retention-days: 1

  release:
    # Holds the write token, so it must never install or run npm code.
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit to main, create tag and release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: lockfile
          path: ${{ runner.temp }}/lockfile

      - name: Apply the upgrade
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          LOCKFILE: ${{ runner.temp }}/lockfile/package-lock.json
        run: |
          # The lockfile comes from the build job, so trust nothing outside the npm registry.
          resolved=$(jq -r '.packages[].resolved // empty' "$LOCKFILE")
          if printf '%s\n' "$resolved" | grep -v '^https://registry\.npmjs\.org/'; then
            echo "Lockfile has a package from outside the npm registry"
            exit 1
          fi
          cp "$LOCKFILE" package-lock.json

          # Rebuilt here, not taken from the build job, so it can't gain scripts or dependencies.
          jq --arg v "$LATEST" '.version = $v | .dependencies.astro = "^" + $v' package.json > package.json.new
          mv package.json.new package.json

      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "upg Astro v$LATEST"
          git push origin HEAD:main
          gh release create "v$LATEST" --target "$(git rev-parse HEAD)" \
            --title "Astro $LATEST" \
            --notes "Upgrades the starter to Astro $LATEST. Changes: https://github.com/withastro/astro/releases/tag/astro%40$LATEST"
