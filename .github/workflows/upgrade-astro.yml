name: Upgrade Astro

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency: upgrade-astro

jobs:
  check:
    # This file ships with the template. Never run in scaffolded projects.
    if: github.repository == 'koval-dev/astro-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open the major-version issue
    outputs:
      latest: ${{ steps.decide.outputs.latest }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(npm view astro version)
          current=$(node -p "require('./package-lock.json').packages['node_modules/astro'].version")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if gh release view "v$latest" >/dev/null 2>&1; then
            echo "v$latest is already released"
            exit 0
          fi

          if [ "${latest%%.*}" -gt "${current%%.*}" ]; then
            title="Upgrade to Astro ${latest%%.*}"
            count=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq length)
            if [ "$count" -eq 0 ]; then
              gh issue create --title "$title" --body "Astro $latest is out. Majors are not auto-released: upgrade by hand using https://docs.astro.build/en/upgrade-astro/. Daily auto-release resumes once main is on this major."
            fi
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    # Runs third-party code, so it gets no write access and nothing leaves this job.
    # Its only effect is passing or failing, which gates the release.
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Upgrade and build
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          # Same resolve as the release job, so this tests the lockfile it will commit.
          npm install "astro@$LATEST" --package-lock-only --ignore-scripts
          npm ci
          npm run build

  release:
    # Holds the write token, so it must never run package code. Packages are
    # resolved here without being installed, and nothing is taken from the build job.
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit to main, create tag and release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply the upgrade
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          npm install "astro@$LATEST" --package-lock-only --ignore-scripts
          npm version "$LATEST" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "upg Astro v$LATEST"
          git push origin HEAD:main
          gh release create "v$LATEST" --target "$(git rev-parse HEAD)" \
            --title "Astro $LATEST" \
            --notes "Upgrades the starter to Astro $LATEST. Changes: https://github.com/withastro/astro/releases/tag/astro%40$LATEST"
